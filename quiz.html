  .q-box { max-width: 720px; margin: 0 auto; }
  .opts { display: grid; gap: 10px; margin-top: 20px; }
  .opt { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 14px 18px; font-size: 18px; font-weight: 500; transition: all .15s; }

<script>
(function () {
  const { $, esc, avatar, FACTION, personById, epByCode, links, Store, toast } = SG;
  const box = $("#box");
  const FACTION_HEX = { wei: "#2F5D8A", shu: "#2E7D4F", wu: "#B23A2E", qun: "#6B5B4B" };
  let i = 0, score = {};

  function getChallengeGuest() {
    const m = location.hash.match(/^#r=([a-z0-9-]+)$/i);
    const guest = m && personById[m[1]];
    return guest && guest.role === "guest" ? guest : null;
  }

  function wrapLines(ctx, text, maxW) {
    const lines = [];
    let line = "";
    for (const ch of String(text || "")) {
      if (ch === "\n") { lines.push(line); line = ""; continue; }
      const next = line + ch;
      if (ctx.measureText(next).width > maxW && line) { lines.push(line); line = ch; }
      else line = next;
    }
    if (line) lines.push(line);
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loadPortrait(id) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = `assets/img/cards/${id}.webp`;
    });
  }

  async function buildResultCardBlob(p, ep) {
    if (document.fonts && document.fonts.ready) {
      try { await document.fonts.ready; } catch (_) {}
    }
    const W = 1080, H = 1080;
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    const fc = FACTION_HEX[p.faction] || "#8A2323";

    // 紙張底色與邊框
    ctx.fillStyle = "#FBF5EA";
    ctx.fillRect(0, 0, W, H);

    // 頂部陣營戲台背景
    const grad = ctx.createLinearGradient(0, 0, W, 430);
    grad.addColorStop(0, fc);
    grad.addColorStop(1, "#2B0C0C");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, 430);
    ctx.fillStyle = "#F0B23E";
    ctx.fillRect(0, 424, W, 6);

    // 頂部標誌
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255, 244, 222, 0.9)";
    ctx.font = '700 28px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText("🎭 三國別演了｜你是哪位三國來賓？", W / 2, 58);

    // 圓形角色頭像（若無圖檔則退回姓氏印章）
    const portrait = await loadPortrait(p.id);
    const cx = W / 2, cy = 192, r = 98;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    if (portrait) {
      const scale = Math.max((r * 2) / portrait.width, (r * 2) / portrait.height);
      const dw = portrait.width * scale, dh = portrait.height * scale;
      ctx.drawImage(portrait, cx - dw / 2, cy - r - (dh - r * 2) * 0.12, dw, dh);
    } else {
      ctx.fillStyle = fc;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      ctx.fillStyle = "#FFF4DE";
      ctx.font = '700 96px "LXGW WenKai TC", serif';
      ctx.textBaseline = "middle";
      const ch = p.name.length > 2 ? p.name.slice(-1) : p.name.slice(0, 1);
      ctx.fillText(ch, cx, cy + 4);
      ctx.textBaseline = "alphabetic";
    }
    ctx.restore();
    ctx.lineWidth = 7; ctx.strokeStyle = "#FFFFFF";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = "#F0B23E";
    ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, Math.PI * 2); ctx.stroke();

    // 角色名稱與標籤
    ctx.fillStyle = "#FFFFFF";
    ctx.font = '700 66px "LXGW WenKai TC", "Noto Serif TC", serif';
    ctx.fillText(p.name, W / 2, 354);
    ctx.fillStyle = "#F6DFC0";
    ctx.font = '500 26px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(`${FACTION[p.faction] || ""}・${p.tags.map(t => "#" + t).join("  ")}`, W / 2, 398);

    // 測驗短評
    ctx.textAlign = "left";
    ctx.fillStyle = "#2A1F1A";
    ctx.font = '700 34px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    const blurbLines = wrapLines(ctx, p.quizBlurb, W - 160).slice(0, 4);
    let y = 505;
    blurbLines.forEach(line => { ctx.fillText(line, 80, y); y += 52; });

    // 本集金句盒
    if (ep && ep.lesson) {
      y += 22;
      ctx.font = '500 27px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
      const lessonLines = wrapLines(ctx, `💡 ${p.name}教你的事：${ep.lesson}`, W - 210).slice(0, 3);
      const boxH = lessonLines.length * 42 + 46;
      roundRect(ctx, 80, y, W - 160, boxH, 16);
      ctx.fillStyle = "#F3E8D5";
      ctx.fill();
      ctx.fillStyle = "#C88A22";
      roundRect(ctx, 80, y, 10, boxH, 5);
      ctx.fill();
      ctx.fillStyle = "#4D1414";
      let ly = y + 50;
      lessonLines.forEach(line => { ctx.fillText(line, 112, ly); ly += 42; });
    }

    // 底部網址引導列
    ctx.fillStyle = "#2B0C0C";
    ctx.fillRect(0, H - 104, W, 104);
    ctx.fillStyle = "#C88A22";
    ctx.fillRect(0, H - 104, W, 4);
    ctx.textAlign = "center";
    ctx.fillStyle = "#F0B23E";
    ctx.font = '700 30px "Noto Sans TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText("你也來測測最像哪位三國來賓 → sanguo-dont-act.pages.dev/quiz", W / 2, H - 40);

    return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
  }

  function start() {
    i = 0; score = {};
    const guests = PEOPLE.filter(p => p.role === "guest");
    const ref = getChallengeGuest();
    const num = n => n <= 10 ? "零一二三四五六七八九十"[n] : n >= 20 ? "零一二三四五六七八九"[Math.floor(n / 10)] + "十" + (n % 10 ? "零一二三四五六七八九"[n % 10] : "") : "十" + "零一二三四五六七八九"[n % 10];
    box.innerHTML = `<div class="card card-pad" style="text-align:center;padding:36px 24px">
      ${ref ? `<div class="challenge-banner">${avatar(ref, 36)}<span>朋友測出最像「<b>${esc(ref.name)}</b>」！換你來測測看</span></div>` : ""}
      <div class="faces">${guests.map(p => `<span>${avatar(p, 50)}</span>`).join("")}</div>
      <h2 style="font-size:clamp(24px,6.5vw,30px);margin-top:20px">${num(guests.length)}位來賓，誰最像你？</h2>
      <p class="muted" style="margin-top:8px">測完會告訴你理由，還能下載結果圖卡分享給朋友。</p>
      <button class="btn btn-red" style="margin-top:22px;font-size:18px" id="go">開始測驗 →</button></div>`;
    $("#go").addEventListener("click", show);
  }
  function show() {
    const item = PERSONA_QUIZ[i];
    box.innerHTML = `<div class="card card-pad fade-in" style="padding:28px">
      <div class="steps" aria-hidden="true">${PERSONA_QUIZ.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>
      <p class="muted small" style="margin-top:14px">第 ${i + 1} / ${PERSONA_QUIZ.length} 題</p>
      <h2 style="font-size:clamp(24px,4vw,30px);margin-top:4px">${esc(item.q)}</h2>
      <div class="opts">${item.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
    </div>`;
    box.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      item.options[+b.dataset.k].p.forEach(id => score[id] = (score[id] || 0) + 1);
      i++;
      i < PERSONA_QUIZ.length ? show() : result();
    }));
    box.querySelector(".opt").focus({ preventScroll: true });
  }
  function result() {
    const order = PEOPLE.filter(p => p.role === "guest").map(p => p.id);
    const ranked = Object.entries(score).sort((a, b) => b[1] - a[1] || order.indexOf(a[0]) - order.indexOf(b[0]));
    const p = personById[ranked[0][0]];
    const others = ranked.slice(1, 3).map(([id]) => personById[id]);
    const ep = epByCode[p.episode];
    const baseUrl = location.href.split("#")[0].split("?")[0];
    const shareUrl = `${baseUrl}#r=${p.id}`;
    const tagsLine = p.tags.map(t => "#" + t).join(" ");
    const lessonLine = ep && ep.lesson ? `\n💡 一句話學三國：${ep.lesson}` : "";
    const shareText = `🎭 我在《三國別演了》測出最像【${p.name}】！\n${tagsLine}\n${p.quizBlurb}${lessonLine}\n\n👉 來測測你是哪位三國來賓：${shareUrl}`;

    Store.vote("persona:" + p.id); // 統計大家測出誰（不影響畫面）
    SG.Cards.mark("quiz:" + p.id);
    box.innerHTML = `<article class="card fade-in f-${p.faction}">
      <div class="result-head">
        ${avatar(p, 96)}
        <p style="margin-top:14px;opacity:.9">你最像的三國來賓是</p>
        <h2>${esc(p.name)}</h2>
        <p style="opacity:.9">${p.tags.map(t => "#" + esc(t)).join("　")}</p>
      </div>
      <div class="card-pad" style="display:grid;gap:16px;padding:24px">
        <p style="font-size:19px;font-weight:700">${esc(p.quizBlurb)}</p>
        ${ep && ep.lesson ? `<p class="ep-lesson">💡 ${esc(p.name)}教你的事：${esc(ep.lesson)}</p>` : ""}
        <p class="muted">${esc(p.oneLine)}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${ep ? `<button class="btn btn-red" data-play="${esc(ep.code)}">▶ 收聽 ${esc(ep.code)} ${esc(p.name)}來作客</button>` : ""}
          <a class="btn btn-line" href="${links.person(p.id)}">📜 看${esc(p.name)}的人物檔案</a>
        </div>
        ${others.length ? `<div style="border-top:1px dashed var(--line);padding-top:14px"><p class="small muted" style="text-align:center;margin-bottom:8px">你身上也有一點……</p>
          <div class="also">${others.map(o => `<a class="chip chip-link" href="${links.person(o.id)}" style="padding:6px 12px">${avatar(o, 26)} ${esc(o.name)}</a>`).join("")}</div></div>` : ""}
        <div class="share-panel">
          <div class="share-row">
            <button class="btn btn-ink btn-sm" type="button" id="share">📋 一鍵複製結果分享</button>
            <button class="btn btn-line btn-sm" type="button" id="downloadCard">🖼️ 下載結果圖卡</button>
            ${typeof navigator.share === "function" ? `<button class="btn btn-line btn-sm" type="button" id="nativeShare">📤 傳給好友</button>` : ""}
            <button class="btn btn-line btn-sm" type="button" id="again">↺ 再測一次</button>
          </div>
        </div>
      </div></article>`;
    $("#again").addEventListener("click", start);
    $("#share").addEventListener("click", async () => {
      const btn = $("#share");
      try {
        await navigator.clipboard.writeText(shareText);
        btn.textContent = "✓ 已複製分享文案";
        toast("已複製！貼到 Threads、LINE 或 FB 揪朋友來測");
        setTimeout(() => { if (btn.isConnected) btn.textContent = "📋 一鍵複製結果分享"; }, 2200);
      } catch (_) {
        prompt("複製這段文字分享：", shareText);
      }
    });
    $("#downloadCard").addEventListener("click", async () => {
      const btn = $("#downloadCard");
      btn.disabled = true; btn.textContent = "圖卡產生中…";
      try {
        const blob = await buildResultCardBlob(p, ep);
        const a = document.createElement("a");
        const url = URL.createObjectURL(blob);
        a.href = url; a.download = `sanguo-quiz-${p.id}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast("已下載結果圖卡！可發限動或 Threads");
      } catch (err) {
        console.warn("結果圖卡產生失敗", err);
        toast("圖卡產生失敗，請改用複製文案分享");
      } finally {
        if (btn.isConnected) { btn.disabled = false; btn.textContent = "🖼️ 下載結果圖卡"; }
      }
    });
    const nativeBtn = $("#nativeShare");
    if (nativeBtn) {
      nativeBtn.addEventListener("click", async () => {
        try {
          const blob = await buildResultCardBlob(p, ep);
          const file = blob ? new File([blob], `sanguo-quiz-${p.id}.png`, { type: "image/png" }) : null;
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: `我在《三國別演了》測出最像【${p.name}】`, text: shareText, files: [file] });
          } else {
            await navigator.share({ title: `我是哪位三國來賓？｜三國別演了`, text: shareText, url: shareUrl });
          }
        } catch (err) {
          if (err && err.name !== "AbortError") toast("無法開啟系統分享，請改按一鍵複製");
        }
      });
    }
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  window.addEventListener("hashchange", () => { if (i === 0) start(); });
  start();
})();
</script>
