<style>
  .tl-box { max-width: 880px; margin: 0 auto; display: grid; gap: 14px; }
  .tl-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .tl-year { font-family: var(--head); font-size: clamp(30px, 6vw, 44px); font-weight: 700; color: var(--curtain); line-height: 1; }
  .tl-title { font-size: clamp(22px, 4vw, 30px); }
  .tl-map { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .tl-map svg { display: block; width: 100%; height: auto; }
  .tl-map text { font-family: var(--head); }
  .tl-paper { fill: var(--paper-2); }
  .tl-cell { fill: var(--paper-2); fill-opacity: .62; transition: fill .8s ease; }
  .tl-border { fill: none; stroke: var(--paper); stroke-width: 2.2; stroke-linejoin: round; opacity: .9; }
  .tl-sea { fill: #CFE0EC; stroke: var(--river); stroke-width: 1.2; }
  .tl-island { fill: var(--paper-2); stroke: var(--river); stroke-width: 1; }
  .tl-wave { fill: none; stroke: var(--river); stroke-width: 1.4; opacity: .55; }
  .tl-sea-name { fill: var(--river); font-size: 17px; font-weight: 700; }
  .tl-river { fill: none; stroke: var(--river); stroke-width: 5; stroke-linecap: round; opacity: .9; }
  .tl-river.small { stroke-width: 2.6; }
  .tl-river-name { fill: var(--river); font-size: 15px; font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
  .tl-river-name.small { font-size: 12px; }
  .tl-owner { font-size: 22px; font-weight: 700; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
  .tl-rname { font-size: 13px; fill: var(--ink); opacity: .75; text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
  .tl-city path { fill: var(--curtain); stroke: var(--paper); stroke-width: 1.2; }
  .tl-city text, .tl-mark text { font-size: 15px; font-weight: 700; fill: var(--curtain-deep); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
  .tl-mark circle { fill: var(--lantern); stroke: var(--curtain); stroke-width: 1.5; }
  .tl-battle { cursor: pointer; }
  .tl-bdot { fill: var(--curtain); stroke: var(--lantern); stroke-width: 2; }
  .tl-ring { fill: none; stroke: var(--lantern); stroke-width: 3; animation: tlring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tlring { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  .tl-sword { stroke: #fff; stroke-width: 2.6; stroke-linecap: round; }
  .tl-btext { font-size: 17px; font-weight: 700; fill: var(--curtain); paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; text-decoration: underline; }
  .tl-battle:hover .tl-bdot { fill: var(--curtain-deep); }
  .tl-frame { fill: none; stroke: var(--gold); stroke-width: 2; }
  .tl-frame.thin { stroke-width: .8; }
  .tl-note { font-size: 12px; fill: var(--muted); font-family: var(--body) !important; }
  .tl-map .compass circle { fill: var(--paper); stroke: var(--gold); stroke-width: 1.4; }
  .tl-map .compass .needle { fill: var(--muted); opacity: .5; }
  .tl-map .compass .needle-n { fill: var(--curtain); }
  .tl-map .compass text { font-size: 14px; font-weight: 700; fill: var(--curtain); text-anchor: middle; }
  .fade { animation: tlfade .6s ease-out both; }
  @keyframes tlfade { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 560px) {
    .tl-owner { font-size: 30px; } .tl-rname { font-size: 18px; } .tl-rname.sub { display: none; }
    .tl-city text, .tl-mark text { font-size: 20px; } .tl-btext { font-size: 22px; }
    .tl-river-name { font-size: 19px; } .tl-sea-name { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .tl-map *, .fade { animation: none !important; transition: none !important; } }

  .tl-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .tl-legend b { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; opacity: .8; }
  .tl-ctrl { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; }
  .tl-range { position: relative; padding-bottom: 26px; }
  .tl-range input { width: 100%; accent-color: var(--curtain); height: 28px; margin: 0; }
  .tl-ticks { position: absolute; left: 10px; right: 10px; top: 28px; height: 22px; }
  .tl-ticks button { position: absolute; transform: translateX(-50%); background: none; border: 0; padding: 0 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-ticks button.on { color: var(--curtain); font-weight: 900; }
  @media (max-width: 560px) {
    .tl-ctrl { grid-template-columns: auto 1fr auto; }
    .tl-ctrl #tlPlay { grid-column: 1 / -1; justify-self: center; }
    .tl-ticks button:nth-child(even) { top: 13px; }
    .tl-range { padding-bottom: 36px; }
  }
  .tl-info .tl-text { font-size: 17px; line-height: 1.8; }
  .src { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tl-cta { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); background: #FFF6E2; border: 2px solid var(--lantern); border-radius: 14px; padding: 12px 14px; font-size: 16px; }
  .tl-cta:hover { border-color: var(--curtain); }
  .tl-cta b { color: var(--curtain); }
