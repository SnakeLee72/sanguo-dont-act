<style>
  .tl-box { max-width: 880px; margin: 0 auto; display: grid; gap: 14px; }
  .tl-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .tl-year { font-family: var(--head); font-size: clamp(30px, 6vw, 44px); font-weight: 700; color: var(--curtain); line-height: 1; }
  .tl-title { font-size: clamp(22px, 4vw, 30px); }
  .tl-map { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .tl-map svg { display: block; width: 100%; height: auto; }
  .tl-map text { font-family: var(--head); }
  .tl-paper { fill: var(--paper-2); }
  .tl-cell { fill: var(--paper-2); fill-opacity: .6; transition: fill .9s ease; }
  .tl-cell.chg { animation: tlchg 1.8s ease-out; }
  @keyframes tlchg { 0% { fill-opacity: .95; } 35% { fill-opacity: .95; } 100% { fill-opacity: .6; } }
  .tl-border { fill: none; stroke: var(--ink); stroke-opacity: .3; stroke-width: 1; stroke-dasharray: 4 3; }
  .tl-fb-halo { fill: none; stroke: var(--paper); stroke-width: 5.5; stroke-linecap: round; opacity: .8; }
  .tl-fb { fill: none; stroke: var(--curtain-deep); stroke-width: 2.4; stroke-linecap: round; opacity: .85; }
  .tl-hatch-line { stroke: #5a3a1a; stroke-opacity: .07; stroke-width: 2; }
  .tl-mtn { fill: var(--paper); fill-opacity: .72; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; stroke-opacity: .8; }
  .tl-mtn-s { fill: none; stroke: var(--ink); stroke-width: 1.1; stroke-opacity: .45; stroke-linecap: round; }
  .tl-sea { fill: #CFE0EC; }
  .tl-wave-line { fill: none; stroke: var(--river); stroke-width: 1; stroke-opacity: .35; }
  .tl-coast { fill: none; stroke: var(--river); stroke-width: 1.6; }
  .tl-island { fill: var(--paper-2); stroke: var(--river); stroke-width: 1.2; }
  .tl-sea-name { fill: var(--river); font-size: 18px; font-weight: 700; paint-order: stroke; stroke: #CFE0EC; stroke-width: 4px; }
  .tl-river-bank { fill: none; stroke: var(--river); stroke-width: 11; stroke-linecap: round; opacity: .22; }
  .tl-river-bank.small { stroke-width: 7; }
  .tl-river { fill: none; stroke: var(--river); stroke-width: 5.5; stroke-linecap: round; }
  .tl-river.small { stroke-width: 2.8; }
  .tl-river-flow { fill: none; stroke: #fff; stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 2 16; opacity: .6; animation: tlflow 3.5s linear infinite; }
  @keyframes tlflow { to { stroke-dashoffset: -28; } }
  .tl-river-name { fill: var(--river); font-size: 15px; font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
  .tl-river-name.small { font-size: 12px; }
  .tl-boat .hull { fill: var(--qun); stroke: var(--ink); stroke-width: .8; }
  .tl-boat .mast { stroke: var(--ink); stroke-width: 1.2; }
  .tl-boat .sail { fill: var(--paper); stroke: var(--ink); stroke-width: .8; }
  .tl-boat .bob { animation: tlbob 3s ease-in-out infinite alternate; }
  @keyframes tlbob { from { transform: translateY(-1.5px) rotate(-3deg); } to { transform: translateY(1.5px) rotate(3deg); } }
  .tl-plaque { fill: var(--paper); fill-opacity: .9; stroke-width: 1.6; }
  .tl-owner { font-size: 21px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .tl-rname { font-size: 13px; font-weight: 700; fill: #4A3A30; text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
  .tl-star { fill: var(--curtain); stroke: var(--paper); stroke-width: 1.2; }
  .tl-pole { stroke: var(--ink); stroke-width: 1.6; }
  .tl-cloth { stroke: var(--ink); stroke-width: .8; transform-box: fill-box; transform-origin: 0 50%; animation: tlwave 1.5s ease-in-out infinite alternate; }
  @keyframes tlwave { from { transform: skewY(-5deg) scaleX(.94); } to { transform: skewY(5deg) scaleX(1); } }
  .tl-flag-ch { fill: #fff; font-size: 9px; font-weight: 700; text-anchor: middle; }
  .tl-cdot { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .tl-cname, .tl-mark text { font-size: 15px; font-weight: 700; fill: var(--curtain-deep); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
  .tl-mark circle { fill: var(--lantern); stroke: var(--curtain); stroke-width: 1.5; }
  .tl-battle { cursor: pointer; }
  .tl-bdot { fill: var(--curtain); stroke: var(--lantern); stroke-width: 2; }
  .tl-ring { fill: none; stroke: var(--lantern); stroke-width: 3; animation: tlring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tlring { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  .tl-sword { stroke: #fff; stroke-width: 2.6; stroke-linecap: round; }
  .tl-hilt { stroke: var(--lantern); stroke-width: 2.4; stroke-linecap: round; }
  .tl-battle:hover .tl-bdot { fill: var(--curtain-deep); }
  .tl-frame { fill: none; stroke: var(--gold); stroke-width: 2; }
  .tl-frame.thin { stroke-width: .8; }
  .tl-note { font-size: 12px; fill: var(--muted); font-family: var(--body) !important; }
  .tl-cloud path { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; opacity: .8; }
  .tl-cartouche rect, .tl-cartouche circle { fill: var(--paper); stroke: var(--gold); stroke-width: 1.6; }
  .tl-cartouche text { font-size: 20px; font-weight: 700; fill: var(--curtain); text-anchor: middle; letter-spacing: 3px; }
  .tl-rose .r1 { fill: var(--curtain); } .tl-rose .r2 { fill: var(--paper); stroke: var(--curtain); stroke-width: .8; }
  .tl-rose .r3 { fill: var(--gold); opacity: .85; } .tl-rose .r0 { fill: var(--lantern); stroke: var(--curtain); }
  .tl-rose text { font-size: 14px; font-weight: 700; fill: var(--curtain); text-anchor: middle; }
  .fade { animation: tlfade .6s ease-out both; }
  @keyframes tlfade { from { opacity: 0; } to { opacity: 1; } }
  @media (max-width: 560px) {
    .tl-owner { font-size: 30px; } .tl-rname { font-size: 18px; } .tl-rname.sub { display: none; }
    .tl-cname, .tl-mark text { font-size: 20px; } .tl-cartouche { display: none; }
    .tl-river-name { font-size: 20px; stroke-width: 2.5px; fill: #24557D; } .tl-sea-name { font-size: 21px; fill: #2F6690; }
    /* 手機上字變小，白色描邊要變細、字要更深，才不會看起來一片白 */
    .tl-rname { opacity: 1; font-family: var(--body); font-weight: 900; font-size: 16px; fill: #3A2A20; stroke-width: 2.4px; }
    .tl-cname, .tl-mark text { font-family: var(--body); font-weight: 900; font-size: 18px; stroke-width: 2.8px; fill: #4A1010; }
    .tl-owner { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .tl-map *, .fade { animation: none !important; transition: none !important; } }

  .tl-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .tl-legend b { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; opacity: .8; }
  .tl-legend .tl-lg-line { display: inline-block; width: 18px; height: 3px; background: var(--curtain-deep); vertical-align: middle; margin-right: 5px; border-radius: 2px; }
  .tl-era { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .tl-ctrl { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; }
  .tl-range { position: relative; padding-bottom: 26px; }
  .tl-range input { width: 100%; accent-color: var(--curtain); height: 28px; margin: 0; }
  .tl-ticks { position: absolute; left: 10px; right: 10px; top: 28px; height: 22px; }
  .tl-ticks button { position: absolute; transform: translateX(-50%); background: none; border: 0; padding: 0 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-ticks button.on { color: var(--curtain); font-weight: 900; }
  @media (max-width: 560px) {
    .tl-ctrl { grid-template-columns: auto 1fr auto; }
    .tl-ctrl #tlPlay { grid-column: 1 / -1; justify-self: center; }
    .tl-ticks button:nth-child(even) { top: 13px; }
    .tl-range { padding-bottom: 36px; }
  }
  .tl-info .tl-text { font-size: 17px; line-height: 1.8; }
  .src { font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tl-cta { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); background: #FFF6E2; border: 2px solid var(--lantern); border-radius: 14px; padding: 12px 14px; font-size: 16px; }
  .tl-cta:hover { border-color: var(--curtain); }
  .tl-cta b { color: var(--curtain); }
</style>
