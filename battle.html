<style>
  .b-box { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 6px; border-radius: 6px; background: var(--line); }
  .steps i.on { background: var(--curtain); }
  .steps i.hit { background: var(--ok); }

  /* 戰場示意圖 */
  .map { border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .map svg { display: block; width: 100%; height: auto; }
  .map text { font-family: var(--head); }
  .map .paper { fill: var(--paper-2); }
  .map .frame { fill: none; stroke: var(--gold); stroke-width: 1.6; }
  .map .frame.thin { stroke-width: .6; }
  .map .note { font-size: 9px; fill: var(--muted); font-family: var(--body); }
  .map .river-bank { fill: none; stroke: var(--river); stroke-width: 18; stroke-linecap: round; opacity: .22; }
  .map .river { fill: none; stroke: var(--river); stroke-width: 8; stroke-linecap: round; opacity: .85; }
  .map .river-flow { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 3 14; opacity: .8; animation: flow 3s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -34; } }
  .map .river-name { fill: var(--river); font-size: 13px; font-weight: 700; }
  .map .mtn-body { fill: var(--paper); stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; opacity: .8; }
  .map .mtn-shade { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .45; }
  .map .grass { fill: none; stroke: var(--shu); stroke-width: 1.1; stroke-linecap: round; opacity: .45; }
  .map .ink { stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
  .map .hole { fill: var(--paper); }
  .map .stake { stroke: var(--ink); stroke-width: 1.2; opacity: .7; }
  .map .sack { fill: var(--lantern); stroke: var(--ink); stroke-width: .8; }
  .map .wave { fill: none; stroke: var(--river); stroke-width: 1.2; }
  .map .pl text { font-size: 14px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; stroke-linejoin: round; }
  .map .pl .ring { fill: rgba(240,178,62,.18); stroke: var(--lantern); stroke-width: 2.5; opacity: 0; }
  .map .pl.focus .ring { opacity: 1; animation: ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
  .map .arw-halo { fill: none; stroke: var(--paper-2); stroke-width: 8; stroke-linecap: round; opacity: .85; }
  .map .arw { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s ease-out forwards; }
  .map .arw.feint { stroke-dasharray: 5 6; stroke-dashoffset: 0; animation: march 1s linear infinite; opacity: .8; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes march { to { stroke-dashoffset: -22; } }
  .map .compass circle { fill: var(--paper); stroke: var(--gold); stroke-width: 1.2; }
  .map .compass .needle { fill: var(--muted); opacity: .5; }
  .map .compass .needle-n { fill: var(--curtain); }
  .map .compass text { font-size: 11px; font-weight: 700; fill: var(--curtain); text-anchor: middle; }
  .map .seal rect { fill: var(--curtain); opacity: .92; }
  .map .seal text { fill: var(--paper); font-size: 12px; font-weight: 700; text-anchor: middle; }
  .map .sword { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  .map .hilt { stroke: var(--gold); stroke-width: 2.4; stroke-linecap: round; }
  .map .spark { fill: var(--lantern); stroke: var(--curtain); stroke-width: .6; animation: spark .9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes spark { from { transform: scale(.6) rotate(0); } to { transform: scale(1.3) rotate(45deg); } }
  .map .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; }
  .map .flame.f1 { fill: var(--curtain); } .map .flame.f2 { fill: var(--lantern); animation-delay: -.2s; } .map .flame.f3 { fill: #FFE7A3; animation-delay: -.35s; }
  @keyframes flick { from { transform: scaleY(.85) skewX(-4deg); } to { transform: scaleY(1.12) skewX(4deg); } }
  .map .smoke { fill: var(--muted); opacity: 0; animation: smoke 2.4s ease-out infinite; }
  .map .smoke.s2 { animation-delay: -1.2s; }
  @keyframes smoke { 0% { opacity: .35; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-14px); } }
  .map .pole { stroke: var(--ink); stroke-width: 1.6; }
  .map .cloth { transform-box: fill-box; transform-origin: 0 50%; animation: wave 1.4s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: skewY(-4deg) scaleX(.94); } to { transform: skewY(4deg) scaleX(1); } }
  .map .flag-ch { fill: #fff; font-size: 10px; font-weight: 700; text-anchor: middle; }
  @media (prefers-reduced-motion: reduce) { .map * { animation: none !important; stroke-dashoffset: 0 !important; } }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend b { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

  .scene { font-size: 17px; line-height: 1.8; }
  .q-title { font-size: clamp(22px, 4vw, 28px); }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 14px 16px; font-size: 17px; font-weight: 500; transition: all .15s; display: flex; gap: 10px; align-items: flex-start; }
  .opt .k { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--paper-2); display: grid; place-items: center; font-weight: 900; color: var(--curtain); }
  .opt:not(:disabled):hover { border-color: var(--curtain); transform: translateX(3px); }
  .opt:disabled { cursor: default; opacity: .55; }
  .opt.picked { opacity: 1; border-color: var(--curtain); background: #FFF6F3; }
  .opt.real { opacity: 1; border-color: var(--ok); }
  .opt .tag { margin-left: auto; flex: 0 0 auto; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: #fff; background: var(--ok); align-self: center; }

  .say { display: flex; gap: 12px; align-items: flex-start; }
  .bubble { background: var(--card); border: 2px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 10px 14px; font-size: 16px; }
  .bubble b { display: block; font-size: 13px; color: var(--muted); }
  .reveal { border: 2px solid var(--gold); background: #FFF9EC; border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
  .reveal h3 { font-size: 20px; }
  .src { font-size: 13px; color: var(--muted); }
  .bars { display: grid; gap: 6px; }
  .crowd-row { display: grid; grid-template-columns: 26px 1fr 44px; gap: 8px; align-items: center; font-size: 14px; }
  .crowd-row .track { height: 12px; background: var(--paper-2); border-radius: 6px; overflow: hidden; }
  .crowd-row .fill { height: 100%; background: var(--muted); border-radius: 6px; width: 0; transition: width .8s ease-out; }
  .crowd-row.mine .fill { background: var(--curtain); }
  .crowd-row.real .fill { background: var(--ok); }
  .crowd-row .pct { text-align: right; font-variant-numeric: tabular-nums; }

  .battle-card { display: grid; grid-template-columns: 1fr; gap: 0; overflow: hidden; }
  .end-head { padding: 28px 22px; text-align: center; color: #fff; background: linear-gradient(135deg, var(--curtain), var(--curtain-deep)); }
  .end-head h2 { font-size: clamp(30px, 7vw, 44px); margin-top: 6px; color: var(--lantern); }
  .score { font-size: 15px; opacity: .9; }
  .myth { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; background: var(--card); }
  .myth .claim { font-weight: 700; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>

<main>
  <section class="page-hero">
    <div class="lanterns" aria-hidden="true"><span class="lantern"></span><span class="lantern"></span><span class="lantern"></span></div>
    <div class="wrap">
      <h1>⚔️ 你來當軍師</h1>
      <p>回到歷史的關鍵時刻，換你做決定！每一步都有主持人吐槽，最後由史官揭曉：當年到底是怎麼選的？</p>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <div class="b-box" id="box"></div>
    </div>
  </section>
</main>
