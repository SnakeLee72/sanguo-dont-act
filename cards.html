<style>
  .cp { max-width: 720px; margin: 0 auto 22px; display: grid; gap: 8px; text-align: center; }
  .cp-num { font-family: var(--head); font-size: 22px; }
  .cp-num b { font-size: 40px; color: var(--curtain); }
  .cp-bar { position: relative; height: 14px; border-radius: 7px; background: var(--paper-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
  .cp-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--curtain); border-radius: 7px; transition: width .8s ease; }
  .cp-bar i.g { background: linear-gradient(90deg, #F7D774, var(--gold)); }
  .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } }
  @media (min-width: 960px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
  .tc-btn { background: none; border: 0; padding: 0; text-align: inherit; cursor: pointer; border-radius: 18px; }

  /* 卡片本體 */
  .tc-btn { perspective: 900px; }
  .tcard { --edge: var(--f); --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 30%; position: relative; aspect-ratio: 5 / 7.8; border-radius: 16px; padding: 5px;
    background: var(--edge); box-shadow: 0 14px 28px -16px rgba(43,12,12,.7), 0 2px 0 rgba(0,0,0,.08);
    transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s ease-out; color: var(--ink); transform-style: preserve-3d; }
  .tc-btn:hover .tcard { transition: transform .08s linear; }
  .tc-btn:focus-visible { outline: 3px solid var(--lantern); outline-offset: 4px; }
  .tcard.gold { --edge: linear-gradient(135deg, #FBE7A1, #C88A22 30%, #F7D774 50%, #B9781A 75%, #FBE7A1); }
  .tc-in { position: relative; height: 100%; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 9px 9px 8px;
    background: radial-gradient(circle at 50% 0%, #FFFDF7, var(--paper) 60%, var(--paper-2));
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gold) 55%, transparent); }
  .tc-corner { position: absolute; width: 16px; height: 16px; fill: none; stroke: var(--gold); stroke-width: 1.6; opacity: .9; z-index: 1; }
  .tc-corner.c1 { top: 4px; left: 4px; } .tc-corner.c2 { top: 4px; right: 4px; transform: scaleX(-1); }
  .tc-corner.c3 { bottom: 4px; left: 4px; transform: scaleY(-1); } .tc-corner.c4 { bottom: 4px; right: 4px; transform: scale(-1); }
  .tc-top { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
  .tc-seal { width: 26px; height: 26px; border-radius: 50%; background: var(--f); color: #fff; display: grid; place-items: center; font-family: var(--head); font-weight: 700; font-size: 13px; box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--f); }
  .tcard[class*="f-qun"] .tc-seal { font-size: 10px; }
  .tc-no { font-family: var(--head); font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: .04em; }
  .tc-art { position: relative; flex: 1; min-height: 0; border-radius: 9px; overflow: hidden; background: linear-gradient(170deg, var(--f), var(--curtain-deep));
    box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--gold); display: grid; place-items: center; }
  .tc-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; transition: transform .4s ease; }
  .tc-btn:hover .tc-art img { transform: scale(1.05); }
  .tc-ch { font-family: var(--head); font-weight: 700; color: #fff; font-size: clamp(44px, 12vw, 64px); line-height: 1; text-shadow: 0 3px 10px rgba(0,0,0,.35); }
  .tc-art:not(.noimg) .tc-ch { visibility: hidden; }
  .tc-role { font-size: 11px; font-weight: 700; background: var(--lantern); color: var(--curtain-deep); padding: 1px 7px; border-radius: 6px; margin: 0 auto 0 6px; }
  .tc-shine { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.45), transparent 45%); mix-blend-mode: soft-light; }
  .tc-btn:hover .tc-shine { opacity: 1; }
  .tc-ribbon { position: relative; z-index: 2; margin: 2px auto 0; padding: 3px 18px 4px; background: var(--f); color: #fff; border-radius: 8px;
    box-shadow: 0 3px 8px -3px rgba(0,0,0,.5), inset 0 0 0 1.5px rgba(255,255,255,.35); }
  .tc-ribbon::before, .tc-ribbon::after { content: ""; position: absolute; top: 7px; width: 12px; height: 70%; background: color-mix(in srgb, var(--f) 70%, #000); z-index: -1; }
  .tc-ribbon::before { left: -8px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .tc-ribbon::after { right: -8px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .tcard.gold .tc-ribbon { background: linear-gradient(135deg, #D9A23A, #B9781A); }
  .tc-name { font-family: var(--head); font-weight: 700; font-size: 19px; letter-spacing: .06em; white-space: nowrap; }
  .tc-sub { font-size: 11px; color: var(--muted); text-align: center; }
  @media (max-width: 639px) { .tc-btn .tc-sub { display: none; } .tc-btn .tc-ribbon { padding: 2px 14px 3px; } .tc-btn .tc-name { font-size: 17px; } .tc-in { gap: 3px; padding: 8px 7px 7px; } }
  .tc-tags { font-size: 11px; color: var(--f); font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-foot { font-size: 11px; text-align: center; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; font-weight: 700; }
  .tcard.gold .tc-foot { color: var(--gold); letter-spacing: .1em; }
  /* 未解鎖：只看得到剪影 */
  .tcard.locked { --edge: #CDBFA9; --f: #8C7B6B; }
  .tcard.locked .tc-art { background: repeating-linear-gradient(45deg, #D8CCB8 0 8px, #D0C3AD 8px 16px); }
  .tcard.locked .tc-art img { filter: grayscale(1) blur(6px) brightness(.85); opacity: .55; transform: scale(1.12); }
  .tcard.locked .tc-art .tc-ch { visibility: hidden; }
  .tc-q { position: absolute; z-index: 2; font-family: var(--head); font-weight: 700; font-size: clamp(40px, 11vw, 60px); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .tcard.locked .tc-no, .tcard.locked .tc-corner { opacity: .5; }
  /* 金卡：流光 */
  .tcard.gold::after { content: ""; position: absolute; inset: 5px; border-radius: 12px; pointer-events: none; z-index: 3;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.6) 44%, rgba(255,230,150,.45) 50%, rgba(160,220,255,.25) 54%, transparent 66%);
    background-size: 250% 100%; animation: shine 3.4s ease-in-out infinite; mix-blend-mode: soft-light; }
  @keyframes shine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -60% 0; } }
  .tcard.gold .tc-in::after { content: "✦"; position: absolute; top: 32%; right: 12%; color: #FFF3C4; font-size: 14px; text-shadow: 0 0 6px #F7D774; animation: twinkle 2.2s ease-in-out infinite; z-index: 3; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
  .tcard.new::before { content: "NEW"; position: absolute; z-index: 4; top: -8px; right: -6px; background: var(--lantern); color: var(--curtain-deep); font-weight: 900; font-size: 11px; padding: 2px 8px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.2); animation: pop .4s ease-out; }
  @media (prefers-reduced-motion: reduce) { .tcard.gold::after, .tcard.gold .tc-in::after { animation: none; } }

  /* 卡片詳細 */
  .cd { display: grid; gap: 18px; padding: 56px 22px 22px; }
  @media (min-width: 720px) { .cd { grid-template-columns: 250px 1fr; align-items: start; padding: 28px; } }
  .cd-card { max-width: 250px; width: 100%; margin: 0 auto; }
  .tcard.big .tc-ch, .tcard.big .tc-q { font-size: 84px; }
  .tcard.big .tc-name { font-size: 26px; }
  .tcard.big .tc-sub, .tcard.big .tc-tags, .tcard.big .tc-foot { font-size: 13px; }
  .tcard.big .tc-ribbon { margin-top: 4px; }
  .cd-info { display: grid; gap: 10px; align-content: start; }
  .cd-facts { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 15px; }
  .cd-h { font-size: 19px; margin-top: 6px; }
  .cd-ms { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .cd-ms li { display: flex; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--card); }
  .cd-ms li.done { border-color: var(--ok); background: #F1F8F2; }
  .cd-ms .ck { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); }
  .cd-ms li.done .ck { background: var(--ok); color: #fff; font-weight: 900; }
  .cd-ms a { color: var(--curtain); font-weight: 700; text-decoration: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .how { max-width: 760px; margin: 28px auto 0; }
  .how ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
</style>
